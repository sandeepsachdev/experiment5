server.port=${PORT:8080}

# Transport NSW API — get a free key at https://opendata.transport.nsw.gov.au
transport.nsw.api.key=${TRANSPORT_NSW_API_KEY:}
transport.nsw.vehicle.url=https://api.transport.nsw.gov.au/v2/gtfs/vehiclepos/metro

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
spring.application.name=sydney-metro

spring.jackson.serialization.write-dates-as-timestamps=false
