<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sydney Metro Live</title>
  <style>
    html { height: 100%; margin: 0; padding: 0; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1b2a;
      color: #e8edf2;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    header {
      background: #0d1b2a;
      border-bottom: 1px solid #1e3a5f;
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 32px; height: 32px; background: #009B77; border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 900; color: #fff;
    }
    .logo-text h1 { font-size: .95rem; font-weight: 700; color: #fff; line-height: 1.1; }
    .logo-text p  { font-size: .67rem; color: #7a9bbf; }
    .spacer { flex: 1; }
    .status-pill {
      display: flex; align-items: center; gap: 6px;
      background: #122033; border: 1px solid #1e3a5f;
      border-radius: 20px; padding: 4px 12px; font-size: .75rem;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #7a9bbf; transition: background .3s;
    }
    .status-dot.ok    { background: #009B77; animation: pulse 2s infinite; }
    .status-dot.error { background: #e05c5c; }
    .status-dot.warn  { background: #f0a500; }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(0,155,119,.6); }
      50%      { box-shadow: 0 0 0 5px rgba(0,155,119,0); }
    }
    #status-text { color: #c5d5e5; }
    #train-count { color: #7a9bbf; font-size: .7rem; }
    #update-time { color: #4a6a8a; font-size: .7rem; }

    .map-wrap { flex: 1; min-height: 0; position: relative; overflow: hidden; }
    #metro-map { display: block; width: 100%; height: 100%; }

    #banner {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: #122033; border: 1px solid #1e3a5f; border-radius: 10px;
      padding: 12px 20px; font-size: .82rem; color: #c5d5e5;
      text-align: center; max-width: 520px; display: none;
    }
    #banner a { color: #009B77; }
    #banner code { background: #1e3a5f; padding: 1px 5px; border-radius: 3px; }

    #countdown {
      position: absolute; bottom: 12px; right: 16px;
      font-size: .68rem; color: #2a4a6a;
    }

    .legend {
      position: absolute; bottom: 12px; left: 16px;
      background: rgba(13,27,42,.88); border: 1px solid #1e3a5f;
      border-radius: 8px; padding: 8px 12px;
      font-size: .7rem; color: #7a9bbf; line-height: 1.9;
    }
    .legend-row  { display: flex; align-items: center; gap: 8px; }
    .legend-line { width: 22px; height: 4px; border-radius: 2px; background: #009B77; }
    .legend-dot  { width: 9px; height: 9px; border-radius: 50%; border: 2px solid #009B77; background: #0d1b2a; }
    .legend-dot.ix { background: #009B77; }
    .legend-train { width: 20px; height: 11px; border-radius: 3px; background: #009B77; display: inline-block; }

    /* ── Train detail panel ─────────────────────────────────────────────── */
    #train-panel {
      position: absolute;
      top: 16px; right: 16px;
      width: 272px;
      background: #0f2336;
      border: 1px solid #1e3a5f;
      border-radius: 12px;
      overflow: hidden;
      transform: translateX(310px);
      opacity: 0;
      transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .3s;
      z-index: 50;
    }
    #train-panel.open { transform: translateX(0); opacity: 1; }

    .panel-head {
      background: #009B77;
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .panel-icon {
      width: 36px; height: 36px; border-radius: 8px;
      background: rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 900; color: #fff; flex-shrink: 0;
    }
    .panel-head-text { flex: 1; min-width: 0; }
    .panel-head-text h2 { font-size: .95rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .panel-head-text p  { font-size: .72rem; color: rgba(255,255,255,.75); margin-top: 1px; }
    .panel-close {
      width: 28px; height: 28px; border-radius: 50%; border: none;
      background: rgba(0,0,0,.2); color: #fff; font-size: 16px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .panel-close:hover { background: rgba(0,0,0,.4); }

    .panel-body { padding: 14px 16px; }
    .panel-row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 6px 0; border-bottom: 1px solid #1e3a5f;
    }
    .panel-row:last-child { border-bottom: none; }
    .panel-key   { font-size: .72rem; color: #7a9bbf; }
    .panel-value { font-size: .82rem; color: #e8edf2; font-weight: 500; text-align: right; max-width: 160px; word-break: break-all; }

    .status-badge {
      display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: .7rem; font-weight: 600;
    }
    .status-badge.transit  { background: rgba(0,155,119,.2); color: #009B77; }
    .status-badge.stopped  { background: rgba(0,212,170,.2); color: #00d4aa; }
    .status-badge.incoming { background: rgba(240,165,0,.2); color: #f0a500; }

    /* SVG classes */
    .station-dot  { fill: #0d1b2a; stroke: #009B77; stroke-width: 2; cursor: pointer; }
    .station-dot.ix { fill: #009B77; }
    .station-label {
      font-size: 13px; fill: #b0c8df;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      pointer-events: none;
    }
    .station-label.ix { fill: #fff; font-weight: 700; font-size: 14px; }

    .train-group { cursor: pointer; }
    .train-body  { fill: #009B77; stroke: rgba(255,255,255,.15); stroke-width: 1; transition: fill .2s; }
    .train-body.stopped  { fill: #00d4aa; filter: drop-shadow(0 0 5px rgba(0,212,170,.8)); }
    .train-body.selected { stroke: #fff; stroke-width: 2; filter: drop-shadow(0 0 6px rgba(255,255,255,.6)); }
    .train-label { font-size: 9px; fill: #fff; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }

    #tooltip {
      position: fixed; background: #122033; border: 1px solid #1e3a5f;
      border-radius: 8px; padding: 7px 11px; font-size: .75rem; color: #c5d5e5;
      pointer-events: none; display: none; white-space: nowrap; z-index: 200;
    }

    /* ── View toggle ─────────────────────────────────────────────────────── */
    .view-toggle { display: flex; background: #122033; border: 1px solid #1e3a5f; border-radius: 8px; overflow: hidden; }
    .view-btn {
      padding: 5px 16px; font-size: .75rem; font-weight: 600;
      color: #7a9bbf; background: none; border: none; cursor: pointer;
      transition: background .2s, color .2s;
    }
    .view-btn.active { background: #009B77; color: #fff; }

    /* ── Table view ──────────────────────────────────────────────────────── */
    #table-wrap {
      flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch;
      padding: 20px 24px; display: none;
    }
    .trains-table { width: 100%; border-collapse: collapse; font-size: .83rem; }
    .trains-table th {
      background: #0f2336; color: #7a9bbf; font-weight: 600;
      font-size: .7rem; text-transform: uppercase; letter-spacing: .05em;
      padding: 11px 14px; text-align: left; white-space: nowrap;
      position: sticky; top: 0; border-bottom: 2px solid #1e3a5f;
      cursor: pointer; user-select: none;
    }
    .trains-table th:hover { color: #c5d5e5; }
    .trains-table th.sort-asc::after  { content: ' ↑'; color: #009B77; }
    .trains-table th.sort-desc::after { content: ' ↓'; color: #009B77; }
    .trains-table td {
      padding: 11px 14px; border-bottom: 1px solid #1a2f47;
      color: #c5d5e5; vertical-align: middle;
    }
    .trains-table tr:hover td { background: #122033; }
    .trains-table code {
      background: #1e3a5f; padding: 2px 7px; border-radius: 4px;
      font-family: monospace; font-size: .85em; color: #e8edf2;
    }
    .speed-val { font-size: .95rem; font-weight: 700; color: #e8edf2; }
    .tbl-empty { text-align: center; padding: 56px 24px; color: #2a4a6a; font-size: .9rem; }

    /* ── Mobile ────────────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      /* Make the map scrollable; give SVG a fixed size matching the 1600:820
         aspect ratio so all stations are reachable by panning */
      .map-wrap { overflow: auto; -webkit-overflow-scrolling: touch; }
      #metro-map { width: 1100px; height: 564px; }

      /* Train panel becomes a bottom sheet instead of a right-side drawer */
      #train-panel {
        position: fixed;
        top: auto; bottom: 0; left: 0; right: 0;
        width: 100%; max-height: 60vh;
        border-radius: 16px 16px 0 0;
        transform: translateY(110%); opacity: 1;
        overflow-y: auto;
      }
      #train-panel.open { transform: translateY(0); opacity: 1; }

      /* Pin legend and countdown to the viewport so they don't scroll away */
      .legend   { position: fixed; bottom: 12px; left: 16px;  z-index: 40; }
      #countdown { position: fixed; bottom: 12px; right: 16px; z-index: 40; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">M</div>
    <div class="logo-text">
      <h1>Sydney Metro Live</h1>
      <p>Real-time positions · Transport NSW</p>
    </div>
  </div>
  <div class="spacer"></div>
  <span id="train-count"></span>
  <span id="update-time"></span>
  <div class="view-toggle">
    <button class="view-btn active" id="btn-map"   onclick="switchView('map')">Map</button>
    <button class="view-btn"        id="btn-table" onclick="switchView('table')">Table</button>
  </div>
  <div class="status-pill">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Connecting…</span>
  </div>
</header>

<div class="map-wrap">
  <svg id="metro-map" viewBox="0 0 1600 820" preserveAspectRatio="xMidYMid slice" text-rendering="geometricPrecision">
    <rect width="1600" height="820" fill="#0d1b2a"/>
    <g opacity="0.03" stroke="#fff" stroke-width="1">
      <line x1="0" y1="164" x2="1600" y2="164"/><line x1="0" y1="328" x2="1600" y2="328"/>
      <line x1="0" y1="492" x2="1600" y2="492"/><line x1="0" y1="656" x2="1600" y2="656"/>
      <line x1="200" y1="0" x2="200" y2="820"/><line x1="400" y1="0" x2="400" y2="820"/>
      <line x1="600" y1="0" x2="600" y2="820"/><line x1="800" y1="0" x2="800" y2="820"/>
      <line x1="1000" y1="0" x2="1000" y2="820"/><line x1="1200" y1="0" x2="1200" y2="820"/>
      <line x1="1400" y1="0" x2="1400" y2="820"/>
    </g>
    <g id="lines"></g>
    <g id="station-dots"></g>
    <g id="station-labels"></g>
    <g id="trains"></g>
  </svg>

  <div id="banner"></div>

  <!-- Train detail panel -->
  <div id="train-panel">
    <div class="panel-head">
      <div class="panel-icon">M</div>
      <div class="panel-head-text">
        <h2 id="panel-title">Train</h2>
        <p id="panel-route"></p>
      </div>
      <button class="panel-close" id="panel-close-btn">✕</button>
    </div>
    <div class="panel-body">
      <div class="panel-row"><span class="panel-key">Status</span><span class="panel-value" id="panel-status"></span></div>
      <div class="panel-row"><span class="panel-key">Speed</span><span class="panel-value" id="panel-speed"></span></div>
      <div class="panel-row"><span class="panel-key">Direction</span><span class="panel-value" id="panel-bearing"></span></div>
      <div class="panel-row"><span class="panel-key">Stop sequence</span><span class="panel-value" id="panel-stop"></span></div>
      <div class="panel-row"><span class="panel-key">Route</span><span class="panel-value" id="panel-routeid"></span></div>
      <div class="panel-row"><span class="panel-key">Trip</span><span class="panel-value" id="panel-trip"></span></div>
      <div class="panel-row"><span class="panel-key">Position</span><span class="panel-value" id="panel-pos"></span></div>
    </div>
  </div>

  <div id="countdown"></div>

  <div class="legend">
    <div class="legend-row"><div class="legend-line"></div><span>Sydney Metro</span></div>
    <div class="legend-row" style="margin-top:4px"><div class="legend-dot"></div><span>Station</span></div>
    <div class="legend-row"><div class="legend-dot ix"></div><span>Interchange</span></div>
    <div class="legend-row"><div class="legend-train"></div><span>Live train (click for details)</span></div>
  </div>
</div>

<div id="table-wrap">
  <table class="trains-table">
    <thead><tr>
      <th data-col="vehicleId">Train</th>
      <th data-col="vehicleStatus">Status</th>
      <th data-col="speed" class="sort-desc">Speed</th>
      <th data-col="bearing">Direction</th>
      <th data-col="routeId">Route</th>
      <th data-col="tripId">Trip</th>
      <th data-col="stopSequence">Stop #</th>
      <th data-col="latitude">Position</th>
    </tr></thead>
    <tbody id="trains-tbody"></tbody>
  </table>
  <p id="tbl-empty" class="tbl-empty" style="display:none">No active trains</p>
</div>

<div id="tooltip"></div>

<script>
// ── Projection ────────────────────────────────────────────────────────────────
// Bounds fitted to Tallawong → Sydenham (no Bankstown)
const BOUNDS = { minLat:-33.950, maxLat:-33.645, minLon:150.850, maxLon:151.265 };
const VW=1600, VH=820, MX=90, MY=65;

function project(lat, lon) {
  const x = (lon - BOUNDS.minLon) / (BOUNDS.maxLon - BOUNDS.minLon) * (VW - MX*2) + MX;
  const y = (BOUNDS.maxLat - lat) / (BOUNDS.maxLat - BOUNDS.minLat) * (VH - MY*2) + MY;
  return [x, y];
}

// ── Station data (Tallawong → Sydenham only) ──────────────────────────────────
const STATIONS = [
  {id:'tallawong',        name:'Tallawong',            lat:-33.689, lon:150.910, ix:false},
  {id:'rouse-hill',       name:'Rouse Hill',           lat:-33.685, lon:150.918, ix:false},
  {id:'kellyville',       name:'Kellyville',           lat:-33.700, lon:150.937, ix:false},
  {id:'bella-vista',      name:'Bella Vista',          lat:-33.706, lon:150.944, ix:false},
  {id:'norwest',          name:'Norwest',              lat:-33.715, lon:150.954, ix:false},
  {id:'hills-showground', name:'Hills Showground',     lat:-33.729, lon:150.972, ix:false},
  {id:'castle-hill',      name:'Castle Hill',          lat:-33.730, lon:151.004, ix:false},
  {id:'cherrybrook',      name:'Cherrybrook',          lat:-33.751, lon:151.011, ix:false},
  {id:'epping',           name:'Epping',               lat:-33.772, lon:151.082, ix:true},
  {id:'macquarie-uni',    name:'Macquarie University', lat:-33.774, lon:151.117, ix:false},
  {id:'macquarie-park',   name:'Macquarie Park',       lat:-33.778, lon:151.123, ix:false},
  {id:'north-ryde',       name:'North Ryde',           lat:-33.800, lon:151.133, ix:false},
  {id:'chatswood',        name:'Chatswood',            lat:-33.797, lon:151.183, ix:true},
  {id:'crows-nest',       name:'Crows Nest',           lat:-33.827, lon:151.207, ix:false},
  {id:'victoria-cross',   name:'Victoria Cross',       lat:-33.839, lon:151.210, ix:false},
  {id:'barangaroo',       name:'Barangaroo',           lat:-33.860, lon:151.200, ix:false},
  {id:'martin-place',     name:'Martin Place',         lat:-33.868, lon:151.210, ix:true},
  {id:'gadigal',          name:'Gadigal',              lat:-33.876, lon:151.207, ix:false},
  {id:'central',          name:'Central',              lat:-33.884, lon:151.206, ix:true},
  {id:'waterloo',         name:'Waterloo',             lat:-33.897, lon:151.203, ix:false},
  {id:'sydenham',         name:'Sydenham',             lat:-33.918, lon:151.170, ix:true},
];

const LINES = [
  { w:6, stations:['tallawong','rouse-hill','kellyville','bella-vista','norwest','hills-showground',
      'castle-hill','cherrybrook','epping','macquarie-uni',
      'macquarie-park','north-ryde','chatswood'] },
  { w:6, stations:['chatswood','crows-nest','victoria-cross','barangaroo',
      'martin-place','gadigal','central','waterloo','sydenham'] },
];

// Label offsets [dx, dy, textAnchor] – tuned for 1600×820 canvas
const LBL = {
  // NW line – alternate above/below; Macquarie cluster gets side labels
  'tallawong':        [  0, -17, 'middle'],
  'rouse-hill':       [  0,  20, 'middle'],
  'kellyville':       [  0, -17, 'middle'],
  'bella-vista':      [  0,  20, 'middle'],
  'norwest':          [  0, -17, 'middle'],
  'hills-showground': [  0,  20, 'middle'],
  'castle-hill':      [  0, -17, 'middle'],
  'cherrybrook':      [  0,  20, 'middle'],
  'epping':           [  0, -17, 'middle'],
  'macquarie-uni':    [-14,   4, 'end'],
  'macquarie-park':   [ 14,   4, 'start'],
  'north-ryde':       [  0,  20, 'middle'],
  // City line – alternate left/right (stations are nearly vertical)
  'chatswood':        [ 14,   4, 'start'],
  'crows-nest':       [ 14,   4, 'start'],
  'victoria-cross':   [-14,   4, 'end'],
  'barangaroo':       [-14,   4, 'end'],
  'martin-place':     [ 14,   4, 'start'],
  'gadigal':          [-14,   4, 'end'],
  'central':          [ 14,   4, 'start'],
  'waterloo':         [-14,   4, 'end'],
  'sydenham':         [  0,  20, 'middle'],
};

// ── Build static SVG ──────────────────────────────────────────────────────────
const NS     = 'http://www.w3.org/2000/svg';
const linesG = document.getElementById('lines');
const dotsG  = document.getElementById('station-dots');
const lblsG  = document.getElementById('station-labels');
const trains = document.getElementById('trains');
const stMap  = Object.fromEntries(STATIONS.map(s => [s.id, s]));

STATIONS.forEach(s => { [s.x, s.y] = project(s.lat, s.lon); });

LINES.forEach(line => {
  const pts = line.stations.map(id => `${stMap[id].x.toFixed(1)},${stMap[id].y.toFixed(1)}`).join(' ');
  const mk  = (a) => { const el = document.createElementNS(NS,'polyline'); Object.entries(a).forEach(([k,v])=>el.setAttribute(k,v)); linesG.appendChild(el); };
  mk({points:pts, fill:'none', stroke:'rgba(0,155,119,.18)', 'stroke-width': line.w+8, 'stroke-linecap':'round','stroke-linejoin':'round'});
  mk({points:pts, fill:'none', stroke:'#009B77', 'stroke-width': line.w, 'stroke-linecap':'round','stroke-linejoin':'round'});
});

const tipEl = document.getElementById('tooltip');
function showTip(e, html) { tipEl.innerHTML=html; tipEl.style.display='block'; moveTip(e); }
function hideTip()        { tipEl.style.display='none'; }
function moveTip(e)       { tipEl.style.left=(e.clientX+14)+'px'; tipEl.style.top=(e.clientY-10)+'px'; }
document.addEventListener('mousemove', e => { if(tipEl.style.display==='block') moveTip(e); });

STATIONS.forEach(s => {
  const r = s.ix ? 9 : 6;
  const dot = document.createElementNS(NS,'circle');
  dot.setAttribute('cx',s.x); dot.setAttribute('cy',s.y); dot.setAttribute('r',r);
  dot.setAttribute('class','station-dot'+(s.ix?' ix':''));
  dot.addEventListener('mouseenter', e => showTip(e, `<b>${s.name}</b>`));
  dot.addEventListener('mouseleave', hideTip);
  dotsG.appendChild(dot);

  const [dx,dy,anchor] = LBL[s.id]||[10,4,'start'];
  const t = document.createElementNS(NS,'text');
  t.setAttribute('x',s.x+dx); t.setAttribute('y',s.y+dy);
  t.setAttribute('class','station-label'+(s.ix?' ix':''));
  t.setAttribute('text-anchor',anchor);
  t.textContent = s.name;
  lblsG.appendChild(t);
});

// ── Train detail panel ────────────────────────────────────────────────────────
const panel     = document.getElementById('train-panel');
const panelBtn  = document.getElementById('panel-close-btn');
let   selectedId = null;

function bearingToDir(b) {
  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
  return dirs[Math.round(b/45) % 8];
}

function statusBadge(raw) {
  const map = { IN_TRANSIT_TO:'transit', STOPPED_AT:'stopped', INCOMING_AT:'incoming' };
  const label = { IN_TRANSIT_TO:'In transit', STOPPED_AT:'Stopped at station', INCOMING_AT:'Approaching' };
  const cls = map[raw] || 'transit';
  return `<span class="status-badge ${cls}">${label[raw] || raw}</span>`;
}

function fillPanel(v) {
  document.getElementById('panel-title').textContent  = 'Train ' + (v.vehicleId || '—');
  document.getElementById('panel-route').textContent  = v.routeId || 'Sydney Metro';
  document.getElementById('panel-status').innerHTML   = statusBadge(v.vehicleStatus);
  document.getElementById('panel-speed').textContent  = v.speed ? Math.round(v.speed*3.6)+' km/h' : '—';
  document.getElementById('panel-bearing').textContent= v.bearing ? bearingToDir(v.bearing)+' ('+Math.round(v.bearing)+'°)' : '—';
  document.getElementById('panel-stop').textContent   = v.stopSequence || '—';
  document.getElementById('panel-routeid').textContent= v.routeId || '—';
  document.getElementById('panel-trip').textContent   = v.tripId || '—';
  document.getElementById('panel-pos').textContent    = v.latitude.toFixed(4)+', '+v.longitude.toFixed(4);
}

function openPanel(v) {
  selectedId = v.vehicleId;
  fillPanel(v);
  panel.classList.add('open');
  highlightSelected();
}

function closePanel() {
  selectedId = null;
  panel.classList.remove('open');
  highlightSelected();
}

function highlightSelected() {
  document.querySelectorAll('.train-body').forEach(el => el.classList.remove('selected'));
  if (selectedId && trainEls[selectedId]) {
    trainEls[selectedId].querySelector('.train-body').classList.add('selected');
  }
}

panelBtn.addEventListener('click', closePanel);
document.getElementById('metro-map').addEventListener('click', e => {
  if (!e.target.closest('.train-group')) closePanel();
});

// ── Train rendering ───────────────────────────────────────────────────────────
const trainEls   = {};
const vehicleMap = {};

function updateTrains(vehicles) {
  const seen = new Set();

  vehicles.forEach(v => {
    vehicleMap[v.vehicleId] = v;
    seen.add(v.vehicleId);
    const [x,y] = project(v.latitude, v.longitude);
    const stopped = v.vehicleStatus === 'STOPPED_AT';
    const lbl = (v.vehicleId || '').slice(-3) || 'M';

    if (!trainEls[v.vehicleId]) {
      const g = document.createElementNS(NS,'g');
      g.setAttribute('class','train-group');
      g.style.transition = 'transform 3s cubic-bezier(.25,.8,.25,1)';

      const rect = document.createElementNS(NS,'rect');
      rect.setAttribute('x',-13); rect.setAttribute('y',-8);
      rect.setAttribute('width',26); rect.setAttribute('height',16); rect.setAttribute('rx',3);
      rect.setAttribute('class','train-body');
      g.appendChild(rect);

      const txt = document.createElementNS(NS,'text');
      txt.setAttribute('class','train-label'); txt.setAttribute('x',0); txt.setAttribute('y',1);
      txt.textContent = lbl;
      g.appendChild(txt);

      g.addEventListener('click', e => { e.stopPropagation(); openPanel(vehicleMap[v.vehicleId]); });
      g.addEventListener('mouseenter', e => showTip(e, `<b>Train ${esc(v.vehicleId)}</b> — click for details`));
      g.addEventListener('mouseleave', hideTip);

      trains.appendChild(g);
      trainEls[v.vehicleId] = g;
    }

    const g = trainEls[v.vehicleId];
    g.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
    const body = g.querySelector('.train-body');
    body.setAttribute('class', 'train-body' + (stopped?' stopped':'') + (v.vehicleId===selectedId?' selected':''));

    if (v.vehicleId === selectedId) fillPanel(v);
  });

  // Remove trains that left the feed
  for (const [id,el] of Object.entries(trainEls)) {
    if (!seen.has(id)) {
      el.remove(); delete trainEls[id]; delete vehicleMap[id];
      if (id === selectedId) closePanel();
    }
  }
  highlightSelected();
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Status bar ────────────────────────────────────────────────────────────────
const dotEl    = document.getElementById('status-dot');
const txtEl    = document.getElementById('status-text');
const cntEl    = document.getElementById('train-count');
const timeEl   = document.getElementById('update-time');
const bannerEl = document.getElementById('banner');
const cdEl     = document.getElementById('countdown');

function setStatus(status, vehicles, lastUpdated) {
  dotEl.className = 'status-dot';
  bannerEl.style.display = 'none';
  if (status === 'ok') {
    dotEl.classList.add('ok'); txtEl.textContent = 'Live';
    cntEl.textContent = `${vehicles.length} train${vehicles.length!==1?'s':''} active`;
  } else if (status === 'no_api_key') {
    dotEl.classList.add('warn'); txtEl.textContent = 'No API key'; cntEl.textContent = '';
    bannerEl.innerHTML =
      '<b>Set your Transport NSW API key to see live trains.</b><br>' +
      'Get a free key at <a href="https://opendata.transport.nsw.gov.au" target="_blank">opendata.transport.nsw.gov.au</a>' +
      ', then set <code>TRANSPORT_NSW_API_KEY</code> on Render.';
    bannerEl.style.display = 'block';
  } else {
    dotEl.classList.add('error'); txtEl.textContent = 'Error'; cntEl.textContent = '';
  }
  if (lastUpdated) timeEl.textContent = 'Updated ' + new Date(lastUpdated).toLocaleTimeString();
}

// ── View toggle ───────────────────────────────────────────────────────────────
const mapWrap   = document.querySelector('.map-wrap');
const tableWrap = document.getElementById('table-wrap');

function switchView(view) {
  document.getElementById('btn-map').classList.toggle('active',   view === 'map');
  document.getElementById('btn-table').classList.toggle('active', view === 'table');
  mapWrap.style.display   = view === 'map'   ? '' : 'none';
  tableWrap.style.display = view === 'table' ? '' : 'none';
}

// ── Table ─────────────────────────────────────────────────────────────────────
let lastVehicles = [];
let sortCol = 'speed';
let sortDir = -1; // -1 = desc

function updateTable(vehicles) {
  const tbody   = document.getElementById('trains-tbody');
  const emptyEl = document.getElementById('tbl-empty');
  lastVehicles  = vehicles;

  if (!vehicles || vehicles.length === 0) {
    tbody.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  const rows = [...vehicles].sort((a, b) => {
    let va = a[sortCol] ?? '', vb = b[sortCol] ?? '';
    if (sortCol === 'speed') { va = va || 0; vb = vb || 0; }
    return sortDir * (typeof va === 'string' ? va.localeCompare(vb) : va - vb);
  });

  tbody.innerHTML = rows.map(v => `<tr>
    <td><code>${esc(v.vehicleId)}</code></td>
    <td>${statusBadge(v.vehicleStatus)}</td>
    <td><span class="speed-val">${v.speed ? Math.round(v.speed * 3.6) : '—'}</span>${v.speed ? ' km/h' : ''}</td>
    <td>${v.bearing ? bearingToDir(v.bearing) + ' ' + Math.round(v.bearing) + '°' : '—'}</td>
    <td>${esc(v.routeId) || '—'}</td>
    <td><small>${esc(v.tripId) || '—'}</small></td>
    <td>${v.stopSequence || '—'}</td>
    <td><small>${v.latitude.toFixed(4)}, ${v.longitude.toFixed(4)}</small></td>
  </tr>`).join('');
}

// Column sort
document.querySelectorAll('.trains-table th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    sortDir = (sortCol === col) ? -sortDir : (col === 'speed' ? -1 : 1);
    sortCol = col;
    document.querySelectorAll('.trains-table th').forEach(h => h.className = '');
    th.className = sortDir === 1 ? 'sort-asc' : 'sort-desc';
    updateTable(lastVehicles);
  });
});

// ── Poll ──────────────────────────────────────────────────────────────────────
const INTERVAL = 30;
let countdown = 0;

async function poll() {
  try {
    const data = await fetch('/api/metro/vehicles').then(r => r.json());
    setStatus(data.status, data.vehicles, data.lastUpdated);
    updateTrains(data.vehicles);
    updateTable(data.vehicles);
  } catch { setStatus('fetch_error', [], null); }
  countdown = INTERVAL;
}

setInterval(() => {
  if (--countdown <= 0) { cdEl.textContent = 'Refreshing…'; poll(); }
  else cdEl.textContent = `Refreshing in ${countdown}s`;
}, 1000);

poll();
</script>
