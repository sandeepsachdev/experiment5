<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sydney Metro Live</title>
  <style>
    html { height: 100%; margin: 0; padding: 0; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1b2a;
      color: #e8edf2;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    header {
      background: #0d1b2a;
      border-bottom: 1px solid #1e3a5f;
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 32px; height: 32px; background: #009B77; border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 900; color: #fff;
    }
    .logo-text h1 { font-size: .95rem; font-weight: 700; color: #fff; line-height: 1.1; }
    .logo-text p  { font-size: .67rem; color: #7a9bbf; }
    .spacer { flex: 1; }
    .status-pill {
      display: flex; align-items: center; gap: 6px;
      background: #122033; border: 1px solid #1e3a5f;
      border-radius: 20px; padding: 4px 12px; font-size: .75rem;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #7a9bbf;
      transition: background .3s;
    }
    .status-dot.ok    { background: #009B77; animation: pulse 2s infinite; }
    .status-dot.error { background: #e05c5c; }
    .status-dot.warn  { background: #f0a500; }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(0,155,119,.6); }
      50%      { box-shadow: 0 0 0 5px rgba(0,155,119,0); }
    }
    #status-text { color: #c5d5e5; }
    #train-count { color: #7a9bbf; font-size: .7rem; }
    #update-time { color: #4a6a8a; font-size: .7rem; }

    .map-wrap {
      flex: 1;
      min-height: 0;      /* allow flex child to shrink */
      position: relative;
      overflow: hidden;
    }

    #metro-map {
      display: block;
      width: 100%;
      height: 100%;
      /* "none" fills the container exactly — no letterboxing */
      /* viewBox 1600:820 ≈ 16:9 so distortion is negligible on modern screens */
    }

    #banner {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: #122033; border: 1px solid #1e3a5f; border-radius: 10px;
      padding: 12px 20px; font-size: .82rem; color: #c5d5e5;
      text-align: center; max-width: 520px; display: none;
    }
    #banner a { color: #009B77; }
    #banner code { background: #1e3a5f; padding: 1px 5px; border-radius: 3px; }

    #countdown {
      position: absolute; bottom: 12px; right: 16px;
      font-size: .68rem; color: #2a4a6a;
    }

    .legend {
      position: absolute; bottom: 12px; left: 16px;
      background: rgba(13,27,42,.88); border: 1px solid #1e3a5f;
      border-radius: 8px; padding: 8px 12px;
      font-size: .7rem; color: #7a9bbf; line-height: 1.9;
    }
    .legend-row  { display: flex; align-items: center; gap: 8px; }
    .legend-line { width: 22px; height: 4px; border-radius: 2px; background: #009B77; }
    .legend-dot  { width: 9px; height: 9px; border-radius: 50%; border: 2px solid #009B77; background: #0d1b2a; }
    .legend-dot.ix { background: #009B77; }
    .legend-train { width: 20px; height: 11px; border-radius: 3px; background: #009B77; display: inline-block; }

    /* SVG element styles (applied via class attribute in createElementNS) */
    .station-dot  { fill: #0d1b2a; stroke: #009B77; stroke-width: 2; cursor: pointer; }
    .station-dot.ix { fill: #009B77; }
    .station-label {
      font-size: 10px; fill: #b0c8df;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      pointer-events: none;
    }
    .station-label.ix { fill: #fff; font-weight: 700; font-size: 11px; }

    .train-group { cursor: pointer; }
    .train-body  { fill: #009B77; stroke: rgba(255,255,255,.2); stroke-width: 1; }
    .train-body.stopped { fill: #00d4aa; filter: drop-shadow(0 0 5px rgba(0,212,170,.7)); }
    .train-label { font-size: 7px; fill: #fff; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }

    #tooltip {
      position: fixed; background: #122033; border: 1px solid #1e3a5f;
      border-radius: 8px; padding: 8px 12px; font-size: .78rem; color: #c5d5e5;
      pointer-events: none; display: none; white-space: nowrap; z-index: 200;
    }
    #tooltip b { color: #fff; }
    #tooltip .tt-row { color: #7a9bbf; margin-top: 2px; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">M</div>
    <div class="logo-text">
      <h1>Sydney Metro Live</h1>
      <p>Real-time positions · Transport NSW</p>
    </div>
  </div>
  <div class="spacer"></div>
  <span id="train-count"></span>
  <span id="update-time"></span>
  <div class="status-pill">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Connecting…</span>
  </div>
</header>

<div class="map-wrap">
  <!-- preserveAspectRatio="none" fills the container exactly; viewBox 1600:820≈16:9 -->
  <svg id="metro-map" viewBox="0 0 1600 820" preserveAspectRatio="none">
    <rect width="1600" height="820" fill="#0d1b2a"/>

    <!-- subtle grid lines -->
    <g opacity="0.03" stroke="#fff" stroke-width="1">
      <line x1="0" y1="164" x2="1600" y2="164"/>
      <line x1="0" y1="328" x2="1600" y2="328"/>
      <line x1="0" y1="492" x2="1600" y2="492"/>
      <line x1="0" y1="656" x2="1600" y2="656"/>
      <line x1="200" y1="0" x2="200" y2="820"/>
      <line x1="400" y1="0" x2="400" y2="820"/>
      <line x1="600" y1="0" x2="600" y2="820"/>
      <line x1="800" y1="0" x2="800" y2="820"/>
      <line x1="1000" y1="0" x2="1000" y2="820"/>
      <line x1="1200" y1="0" x2="1200" y2="820"/>
      <line x1="1400" y1="0" x2="1400" y2="820"/>
    </g>

    <g id="lines"></g>
    <g id="station-dots"></g>
    <g id="station-labels"></g>
    <g id="trains"></g>
  </svg>

  <div id="banner"></div>
  <div id="countdown"></div>

  <div class="legend">
    <div class="legend-row"><div class="legend-line"></div><span>Sydney Metro</span></div>
    <div class="legend-row" style="margin-top:4px"><div class="legend-dot"></div><span>Station</span></div>
    <div class="legend-row"><div class="legend-dot ix"></div><span>Interchange</span></div>
    <div class="legend-row"><div class="legend-train"></div><span>Live train</span></div>
  </div>
</div>

<div id="tooltip"></div>

<script>
// ── Map projection ──────────────────────────────────────────────────────────
// Tight bounds that centre the metro network and use the full canvas.
// Tallawong=150.910W, Chatswood/Martin Place=151.210E, Rouse Hill=-33.685N, Wiley Park=-33.928S
const BOUNDS = { minLat:-33.945, maxLat:-33.660, minLon:150.885, maxLon:151.240 };
const VW=1600, VH=820, MX=80, MY=60; // left/right and top/bottom margins

function project(lat, lon) {
  const x = (lon - BOUNDS.minLon) / (BOUNDS.maxLon - BOUNDS.minLon) * (VW - MX*2) + MX;
  const y = (BOUNDS.maxLat - lat) / (BOUNDS.maxLat - BOUNDS.minLat) * (VH - MY*2) + MY;
  return [x, y];
}

// ── Station data ────────────────────────────────────────────────────────────
const STATIONS = [
  // Northwest
  {id:'tallawong',        name:'Tallawong',            lat:-33.689, lon:150.910, ix:false},
  {id:'rouse-hill',       name:'Rouse Hill',           lat:-33.685, lon:150.918, ix:false},
  {id:'kellyville',       name:'Kellyville',           lat:-33.700, lon:150.937, ix:false},
  {id:'norwest',          name:'Norwest',              lat:-33.715, lon:150.954, ix:false},
  {id:'hills-showground', name:'Hills Showground',     lat:-33.729, lon:150.972, ix:false},
  {id:'bella-vista',      name:'Bella Vista',          lat:-33.741, lon:150.977, ix:false},
  {id:'cherrybrook',      name:'Cherrybrook',          lat:-33.751, lon:151.011, ix:false},
  {id:'epping',           name:'Epping',               lat:-33.772, lon:151.082, ix:true},
  {id:'macquarie-uni',    name:'Macquarie University', lat:-33.774, lon:151.117, ix:false},
  {id:'macquarie-park',   name:'Macquarie Park',       lat:-33.778, lon:151.123, ix:false},
  {id:'north-ryde',       name:'North Ryde',           lat:-33.800, lon:151.133, ix:false},
  {id:'chatswood',        name:'Chatswood',            lat:-33.797, lon:151.183, ix:true},
  // City & Southwest
  {id:'crows-nest',       name:'Crows Nest',           lat:-33.827, lon:151.207, ix:false},
  {id:'victoria-cross',   name:'Victoria Cross',       lat:-33.839, lon:151.210, ix:false},
  {id:'barangaroo',       name:'Barangaroo',           lat:-33.860, lon:151.200, ix:false},
  {id:'martin-place',     name:'Martin Place',         lat:-33.868, lon:151.210, ix:true},
  {id:'gadigal',          name:'Gadigal',              lat:-33.876, lon:151.207, ix:false},
  {id:'waterloo',         name:'Waterloo',             lat:-33.897, lon:151.203, ix:false},
  {id:'sydenham',         name:'Sydenham',             lat:-33.918, lon:151.170, ix:true},
  // Bankstown
  {id:'marrickville',     name:'Marrickville',         lat:-33.910, lon:151.161, ix:false},
  {id:'dulwich-hill',     name:'Dulwich Hill',         lat:-33.913, lon:151.134, ix:false},
  {id:'hurlstone-park',   name:'Hurlstone Park',       lat:-33.916, lon:151.120, ix:false},
  {id:'canterbury',       name:'Canterbury',           lat:-33.916, lon:151.112, ix:false},
  {id:'campsie',          name:'Campsie',              lat:-33.909, lon:151.103, ix:false},
  {id:'belmore',          name:'Belmore',              lat:-33.918, lon:151.092, ix:false},
  {id:'lakemba',          name:'Lakemba',              lat:-33.920, lon:151.073, ix:false},
  {id:'wiley-park',       name:'Wiley Park',           lat:-33.928, lon:151.070, ix:false},
  {id:'punchbowl',        name:'Punchbowl',            lat:-33.927, lon:151.053, ix:false},
  {id:'bankstown',        name:'Bankstown',            lat:-33.917, lon:151.034, ix:true},
];

const LINES = [
  { color:'#009B77', w:6, stations:[
    'tallawong','rouse-hill','kellyville','norwest','hills-showground',
    'bella-vista','cherrybrook','epping','macquarie-uni','macquarie-park',
    'north-ryde','chatswood']},
  { color:'#009B77', w:6, stations:[
    'chatswood','crows-nest','victoria-cross','barangaroo',
    'martin-place','gadigal','waterloo','sydenham']},
  { color:'#009B77', w:6, stations:[
    'sydenham','marrickville','dulwich-hill','hurlstone-park',
    'canterbury','campsie','belmore','lakemba','wiley-park','punchbowl','bankstown']},
];

// [dx, dy, textAnchor]  — tuned for the 1600×820 canvas with these bounds
const LBL = {
  'tallawong':        [  0, -13, 'middle'],
  'rouse-hill':       [  0, -13, 'middle'],
  'kellyville':       [  0, -13, 'middle'],
  'norwest':          [  0, -13, 'middle'],
  'hills-showground': [  0,  17, 'middle'],
  'bella-vista':      [  0,  17, 'middle'],
  'cherrybrook':      [  0,  17, 'middle'],
  'epping':           [  0, -13, 'middle'],
  'macquarie-uni':    [  0,  17, 'middle'],
  'macquarie-park':   [  0, -13, 'middle'],
  'north-ryde':       [  0,  17, 'middle'],
  'chatswood':        [ 12,   4, 'start'],
  'crows-nest':       [ 12,   4, 'start'],
  'victoria-cross':   [ 12,   4, 'start'],
  'barangaroo':       [-12,   4, 'end'],
  'martin-place':     [ 12,   4, 'start'],
  'gadigal':          [-12,   4, 'end'],
  'waterloo':         [-12,   4, 'end'],
  'sydenham':         [ 12,  -8, 'start'],
  'marrickville':     [  0, -13, 'middle'],
  'dulwich-hill':     [  0,  17, 'middle'],
  'hurlstone-park':   [  0, -13, 'middle'],
  'canterbury':       [  0,  17, 'middle'],
  'campsie':          [  0, -13, 'middle'],
  'belmore':          [  0,  17, 'middle'],
  'lakemba':          [  0, -13, 'middle'],
  'wiley-park':       [  0,  17, 'middle'],
  'punchbowl':        [  0, -13, 'middle'],
  'bankstown':        [  0,  17, 'middle'],
};

// ── Build SVG ───────────────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
const linesG  = document.getElementById('lines');
const dotsG   = document.getElementById('station-dots');
const labelsG = document.getElementById('station-labels');
const trainsG = document.getElementById('trains');
const stMap   = Object.fromEntries(STATIONS.map(s => [s.id, s]));

STATIONS.forEach(s => { [s.x, s.y] = project(s.lat, s.lon); });

// Draw lines (shadow + coloured stroke)
LINES.forEach(line => {
  const pts = line.stations.map(id => `${stMap[id].x.toFixed(1)},${stMap[id].y.toFixed(1)}`).join(' ');
  const mk = (attrs) => { const el = document.createElementNS(NS,'polyline'); Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v)); linesG.appendChild(el); };
  mk({points:pts, fill:'none', stroke:'rgba(0,155,119,.2)', 'stroke-width':line.w+6, 'stroke-linecap':'round', 'stroke-linejoin':'round'});
  mk({points:pts, fill:'none', stroke:line.color, 'stroke-width':line.w, 'stroke-linecap':'round', 'stroke-linejoin':'round'});
});

// Draw station dots
STATIONS.forEach(s => {
  const r = s.ix ? 8 : 5;
  const dot = document.createElementNS(NS, 'circle');
  dot.setAttribute('cx', s.x); dot.setAttribute('cy', s.y); dot.setAttribute('r', r);
  dot.setAttribute('class', 'station-dot' + (s.ix ? ' ix' : ''));
  dot.addEventListener('mouseenter', e => showTip(e, `<b>${s.name}</b><div class="tt-row">${s.ix ? 'Interchange station' : 'Metro station'}</div>`));
  dot.addEventListener('mouseleave', hideTip);
  dotsG.appendChild(dot);

  const [dx, dy, anchor] = LBL[s.id] || [10, 4, 'start'];
  const txt = document.createElementNS(NS, 'text');
  txt.setAttribute('x', s.x + dx); txt.setAttribute('y', s.y + dy);
  txt.setAttribute('class', 'station-label' + (s.ix ? ' ix' : ''));
  txt.setAttribute('text-anchor', anchor);
  txt.textContent = s.name;
  labelsG.appendChild(txt);
});

// ── Tooltip ──────────────────────────────────────────────────────────────────
const tipEl = document.getElementById('tooltip');
function showTip(e, html) { tipEl.innerHTML = html; tipEl.style.display = 'block'; moveTip(e); }
function hideTip()        { tipEl.style.display = 'none'; }
function moveTip(e)       { tipEl.style.left = (e.clientX+14)+'px'; tipEl.style.top = (e.clientY-10)+'px'; }
document.addEventListener('mousemove', e => { if (tipEl.style.display === 'block') moveTip(e); });

// ── Trains ───────────────────────────────────────────────────────────────────
const trainEls = {};

function updateTrains(vehicles) {
  const seen = new Set();
  vehicles.forEach(v => {
    const [x, y] = project(v.latitude, v.longitude);
    const stopped = v.vehicleStatus === 'STOPPED_AT';
    const label   = (v.vehicleId || '').slice(-3) || 'M';
    seen.add(v.vehicleId);

    let g = trainEls[v.vehicleId];
    if (!g) {
      g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'train-group');
      g.style.transition = 'transform 3s cubic-bezier(.25,.8,.25,1)';

      const rect = document.createElementNS(NS, 'rect');
      rect.setAttribute('x',-13); rect.setAttribute('y',-8);
      rect.setAttribute('width',26); rect.setAttribute('height',16);
      rect.setAttribute('rx',3); rect.setAttribute('class','train-body');
      g.appendChild(rect);

      const txt = document.createElementNS(NS, 'text');
      txt.setAttribute('class','train-label'); txt.setAttribute('x',0); txt.setAttribute('y',1);
      txt.textContent = label;
      g.appendChild(txt);

      g.addEventListener('mouseenter', e => {
        const kmh = v.speed ? Math.round(v.speed*3.6)+' km/h' : '—';
        showTip(e,`<b>Train ${esc(v.vehicleId)}</b><div class="tt-row">Trip: ${esc(v.tripId||'—')}</div><div class="tt-row">Speed: ${kmh}</div><div class="tt-row">Status: ${esc(v.vehicleStatus.replace(/_/g,' ').toLowerCase())}</div>`);
      });
      g.addEventListener('mouseleave', hideTip);
      trainsG.appendChild(g);
      trainEls[v.vehicleId] = g;
    }

    g.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
    g.querySelector('.train-body').setAttribute('class', 'train-body' + (stopped ? ' stopped' : ''));
  });

  for (const [id, el] of Object.entries(trainEls)) {
    if (!seen.has(id)) { el.remove(); delete trainEls[id]; }
  }
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Status UI ─────────────────────────────────────────────────────────────────
const dotEl   = document.getElementById('status-dot');
const txtEl   = document.getElementById('status-text');
const cntEl   = document.getElementById('train-count');
const timeEl  = document.getElementById('update-time');
const bannerEl= document.getElementById('banner');
const cdEl    = document.getElementById('countdown');

function setStatus(status, vehicles, lastUpdated) {
  dotEl.className = 'status-dot';
  bannerEl.style.display = 'none';
  if (status === 'ok') {
    dotEl.classList.add('ok'); txtEl.textContent = 'Live';
    cntEl.textContent = `${vehicles.length} train${vehicles.length!==1?'s':''} active`;
  } else if (status === 'no_api_key') {
    dotEl.classList.add('warn'); txtEl.textContent = 'No API key';
    cntEl.textContent = '';
    bannerEl.innerHTML =
      '<b>Set your Transport NSW API key to see live trains.</b><br>' +
      'Get a free key at <a href="https://opendata.transport.nsw.gov.au" target="_blank">opendata.transport.nsw.gov.au</a>' +
      ', then set <code>TRANSPORT_NSW_API_KEY</code> on Render.';
    bannerEl.style.display = 'block';
  } else {
    dotEl.classList.add('error'); txtEl.textContent = 'Error';
    cntEl.textContent = '';
  }
  if (lastUpdated) {
    timeEl.textContent = 'Updated ' + new Date(lastUpdated).toLocaleTimeString();
  }
}

// ── Poll ──────────────────────────────────────────────────────────────────────
const INTERVAL = 30;
let countdown = 0;

async function poll() {
  try {
    const data = await fetch('/api/metro/vehicles').then(r => r.json());
    setStatus(data.status, data.vehicles, data.lastUpdated);
    updateTrains(data.vehicles);
  } catch { setStatus('fetch_error', [], null); }
  countdown = INTERVAL;
}

setInterval(() => {
  if (--countdown <= 0) { cdEl.textContent = 'Refreshing…'; poll(); }
  else cdEl.textContent = `Refreshing in ${countdown}s`;
}, 1000);

poll();
</script>
</body>
</html>
